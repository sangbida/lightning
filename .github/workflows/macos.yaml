name: Mac OS pytest
on:
  pull_request:
jobs:
  # Temporary repro: Homebrew shellcheck 0.11 vs master x-prefix in compacter-slow.sh.
  # Do NOT include the script fix on this branch — that's the point.
  smoke-test:
    name: Smoke Test macOS
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install shellcheck + gmake
        run: |
          brew install make shellcheck
          shellcheck --version
          gmake --version | head -1

      - name: Run check-shellcheck
        run: gmake check-shellcheck
